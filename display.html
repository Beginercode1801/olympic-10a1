<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Màn hình lớn</title>
<base href="https://beginercode1801.github.io/olympic-10a1/">
    <script src="common.js"></script>
<style>
.wrap{min-height:100vh;display:flex;flex-direction:column;padding:24px;gap:18px}
.round{font-size:28px;color:#ffd24a;text-transform:uppercase;letter-spacing:2px}
.q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(28px,5vw,64px);font-weight:700;line-height:1.3;padding:20px}
.timer{font-size:72px;font-weight:800;text-align:center;color:#ffd24a}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#12204a;border-radius:14px;padding:14px;text-align:center;border:3px solid transparent}
.card .n{font-size:22px;font-weight:700}.card .s{font-size:40px;font-weight:800;color:#ffd24a}
.card.first{border-color:#3ddc84;background:#14452d}.card.out{opacity:.35}.card.done{border-color:#2f5bff}
.tag{font-size:18px;margin-top:4px;min-height:24px}
</style></head><body><div class="wrap">
<div class="round" id="round"></div>
<div class="timer" id="timer"></div>
<div class="q" id="q"></div>
<div class="board" id="board"></div>
</div>
<script>
const style=document.createElement('style');style.textContent=BASE_CSS;document.head.appendChild(style);
const api=connect({role:'display'},render);
function render(s){
  document.getElementById('round').textContent=s.round;
  document.getElementById('q').textContent=s.visible?s.text:'';
  document.getElementById('board').innerHTML=s.players.map((p,i)=>{
    const slot=i+1, b=s.buzz.findIndex(x=>x.slot===slot), a=s.answers[slot];
    let cls='card', tag='';
    if(s.out.includes(slot)){cls+=' out';tag='Mất quyền'}
    if(s.mode==='buzz'&&b>=0){tag=`#${b+1} · ${fmt(s.buzz[b].t)}`; if(b===0)cls+=' first'}
    if(s.mode==='answer'&&a){
      if(s.revealed){tag=`${esc(a.text)} · ${fmt(a.t)}`+(a.correct===true?' ✔':a.correct===false?' ✘':'')}
      else{tag='Đã trả lời';cls+=' done'}
    }
    return `<div class="${cls}"><div class="n">${esc(p.name||'Thí sinh '+slot)}</div><div class="s">${p.score}</div><div class="tag">${tag}</div></div>`;
  }).join('');
}
setInterval(()=>{const s=api.state;if(!s)return;const r=remaining(s,api);document.getElementById('timer').textContent=r==null||!s.visible?'':Math.ceil(r)},100);
</script></body></html>
